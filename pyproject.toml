[project]
name = "socialsentinel"
version = "1.0.0"
description = "Social Media Sentiment & Reputation Intelligence CLI"
authors = [{ name = "SocialSentinel Team" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.8.0",
    "joblib>=1.3.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
